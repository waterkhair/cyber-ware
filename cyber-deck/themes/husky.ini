[main]
font=monospace:size=12
prompt="[>] "
width=48
lines=10
horizontal-pad=24
vertical-pad=12
inner-pad=8
layer=overlay

[colors]
background=000000f2
text=eeeeeeff
prompt=ffffffff
placeholder=999999ff
input=ddddddff
match=ccccccff
selection=333333ff
selection-text=ffffffff
selection-match=ffffffff
counter=aaaaaaff
border=ccccccff

[border]
width=2
radius=9

[key-bindings]
delete-line-forward=none
next=Down Control+n Control+j
prev=Up Control+p Control+k
